name: Feature request
description: Suggest an improvement to Tilde's terminal experience
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Pre-submit check
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What terminal workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
