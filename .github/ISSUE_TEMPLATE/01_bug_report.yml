name: Bug report
description: Report a reproducible problem in Tilde
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Pre-submit check
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reliably reproduces the problem.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tilde version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add relevant logs, screenshots, shell details, or environment information. Remove secrets and personal data.
