name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=0

jobs:
  terminal-checks:
    name: Terminal checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libclang-dev \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgit2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler \
            python-is-python3

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2

      - name: Check formatting
        run: ./script/format --check

      - name: Check terminal app
        run: cargo check --locked -p warp --lib

      - name: Test terminal CLI
        run: cargo test --locked -p warp_cli --lib

      - name: Test terminal TUI
        run: cargo test --locked -p warp_tui --lib
