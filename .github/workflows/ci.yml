name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=0

jobs:
  terminal-checks:
    name: Terminal checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            fish \
            libasound2-dev \
            libclang-dev \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgit2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler \
            python-is-python3

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2

      - name: Check formatting
        run: ./script/format --check

      - name: Enforce local-only dependency and endpoint policy
        run: |
          python3 script/test_local_only.py
          python3 script/check_local_only.py

      - name: Check Linux GUI binary
        run: cargo check --locked -p warp --bin tilde --features gui

      - name: Clippy terminal app
        run: cargo clippy --locked -p warp --lib --features gui

      - name: Test terminal grid, editor, and renderer core
        run: cargo test --locked -p warp_terminal -p warp_editor -p warpui_core --lib

      - name: Test shell widget handoff
        run: |
          python3 script/test_shell_widget_handoff.py
          cargo test --locked -p warp --lib handoff
          cargo test --locked -p warp --lib ctrl_t_action_forwards_to_pty_when_no_external_widget_detected

      - name: Test migration replay and persistence compatibility
        run: cargo test --locked -p persistence --lib

      - name: Test SSH bootstrap and settings preservation
        run: |
          cargo test --locked -p warp --lib terminal::model_events::
          cargo test --locked -p warp --lib terminal::warpify::settings::
          cargo test --locked -p warp --lib local_and_ssh_executors_do_not_require_a_remote_server
          cargo test --locked -p warp --lib retired_input_predictions_are_not_registered_settings
          cargo test --locked -p warp --lib terminal::autosuggestions::tests::

      - name: Test terminal CLI
        run: cargo test --locked -p warp_cli --lib

      - name: Test terminal TUI
        run: cargo test --locked -p warp_tui --lib
